name: ESG AI Risk Manager - Enterprise CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-validation:
    name: Build, Security, Test & Regression Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio pydantic fastapi uvicorn requests httpx

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Step 1 - Python Unit & Security Evaluation Tests
        run: |
          python -m pytest tests/ -v

      - name: Step 2 - Frontend Production Build
        run: |
          cd frontend
          npm run build

      - name: Step 3 - Backup & Restore Verification Check
        run: |
          node scripts/backup_restore.js --test-restore
